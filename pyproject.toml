[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-codealong"
version = "0.1.0"
description = "Adaptive retrieval-augmented generation tutorial and document API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "chromadb>=1.0,<2",
    "docx2txt>=0.9,<1",
    "fastapi>=0.115,<1",
    "langchain-classic>=1.0,<2",
    "langgraph>=1,<2",
    "langchain-chroma>=1.0,<2",
    "langchain-community>=0.4,<1",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "pytubefix>=9,<11",
    "tiktoken>=0.9,<1",
    "uvicorn[standard]>=0.34,<1",
    "youtube-transcript-api>=1,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "reportlab>=4.2,<5",
    "ruff>=0.11,<1",
]

eval = [
    "ragas>=0.4.3,<0.5",
]

[project.scripts]
rag-codealong = "rag_codealong:main"

[tool.setuptools]
py-modules = ["rag_codealong"]

[tool.setuptools.packages.find]
include = ["rag_tutorial*"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
